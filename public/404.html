<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          sessionStorage.setItem(
            "spa-redirect",
            window.location.pathname + window.location.search + window.location.hash,
          )
        } catch {}
        window.location.replace("/")
      })()
    </script>
  </head>
  <body></body>
</html>
